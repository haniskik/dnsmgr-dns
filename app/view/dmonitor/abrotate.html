{extend name="common/layout" /}
{block name="title"}A/B轮换配置{/block}
{block name="main"}
<div class="row">
	<div class="col-xs-12 center-block" style="float: none;">
	<div class="panel panel-default panel-intro">
	<div class="panel-body">
	<p class="text-muted">每日轮换 A/B 槽随机二级域名，并可将<strong>固定业务域名</strong>的 CNAME 指向最新随机域名。配置需先在数据库添加，此处仅支持编辑固定域名、随机前缀、启用状态。</p>
	<a href="javascript:;$('#listTable').bootstrapTable('refresh')" class="btn btn-default"><i class="fa fa-refresh"></i> 刷新</a>
	<table id="listTable"></table>
	</div>
	</div>
	</div>
</div>
{/block}
{block name="script"}
<script src="/static/js/layer/layer.js"></script>
<script src="/static/js/bootstrap-table-1.21.4.min.js"></script>
<script src="/static/js/bootstrap-table-page-jump-to-1.21.4.min.js"></script>
<script src="/static/js/custom.js"></script>
<script>
$(document).ready(function(){
	updateToolbar();
	$("#listTable").bootstrapTable({
		url: '/dmonitor/abrotate/data',
		pageNumber: 1,
		pageSize: 15,
		classes: 'table table-striped table-hover table-bordered',
		columns: [
			{ field: 'id', title: 'ID', width: 60 },
			{ field: 'domain', title: '主域名' },
			{ field: 'fixed_domain', title: '固定业务域名', formatter: function(v) { return v && v !== '—' ? '<code>' + v + '</code>' : '—'; } },
			{ field: 'current_slot', title: '下次轮换槽', formatter: function(v) { return v === 'A' ? 'A 槽' : 'B 槽'; } },
			{ field: 'prefix', title: '随机前缀' },
			{ field: 'active_str', title: '状态' },
			{
				field: 'action',
				title: '操作',
				formatter: function(value, row) {
					var id = row.id || '';
					return '<a href="/dmonitor/abrotate_edit?id=' + id + '" class="btn btn-primary btn-xs" target="_self"><i class="fa fa-edit"></i> 编辑</a>';
				}
			}
		]
	});
});
</script>
{/block}
